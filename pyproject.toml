[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "android-mcp-adb"
version = "2.0.0"
description = "Full Android control from any AI agent via MCP — 7 tools, 90fps viewer, WiFi ADB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["android", "mcp", "ai", "automation", "adb", "uiautomator2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]
dependencies = [
    "mcp>=1.0.0",
    "uiautomator2>=3.0.0",
    "aiohttp>=3.9.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
vision = ["opencv-python>=4.8.0", "numpy>=1.24.0"]
full = ["pytesseract>=0.3.10", "opencv-python>=4.8.0", "numpy>=1.24.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
android-mcp        = "server:main"
android-mcp-config = "mcp_config:main"
android-mcp-viewer = "viewer:main"
android-mcp-adb    = "server:main"

[project.urls]
Homepage   = "https://github.com/Steph-ux/android-mcp"
Repository = "https://github.com/Steph-ux/android-mcp"
Issues     = "https://github.com/Steph-ux/android-mcp/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["backends*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.setuptools]
py-modules = [
    "server",
    "viewer",
    "mcp_config",
    "device_manager",
]
